<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0B0F14"/>
  
  <!-- Concentric signal rings radiating outward - offset composition -->
  <circle cx="108" cy="128" r="96" fill="none" stroke="#38F2C8" stroke-width="1.5" opacity="0.15"/>
  <circle cx="108" cy="128" r="78" fill="none" stroke="#38F2C8" stroke-width="1.5" opacity="0.25"/>
  <circle cx="108" cy="128" r="62" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.4"/>
  <circle cx="108" cy="128" r="46" fill="none" stroke="#38F2C8" stroke-width="2.5" opacity="0.65"/>
  
  <!-- Signal ring pulse segments - broken arcs for technical feel -->
  <path d="M 108 32 A 96 96 0 0 1 204 128" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <path d="M 108 50 A 78 78 0 0 1 186 128" fill="none" stroke="#38F2C8" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 108 66 A 62 62 0 0 1 170 128" fill="none" stroke="#38F2C8" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Stylized eye shape - the outer almond/lens form -->
  <path d="M 24 128 Q 72 62 108 62 Q 144 62 192 128 Q 144 194 108 194 Q 72 194 24 128 Z" 
        fill="#0B0F14" stroke="#E6EDF3" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner eye contour - subtle technical detail -->
  <path d="M 40 128 Q 78 76 108 76 Q 138 76 176 128 Q 138 180 108 180 Q 78 180 40 128 Z" 
        fill="none" stroke="#38F2C8" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Play button - bold, integrated into eye, offset slightly right -->
  <polygon points="86,92 86,164 156,128" fill="#FF3B30"/>
  
  <!-- Play button edge accent for depth -->
  <polyline points="86,92 86,164 156,128" fill="none" stroke="#E6EDF3" stroke-width="2" opacity="0.3" stroke-linejoin="round"/>
  
  <!-- Pupil/iris detail - crescent highlight -->
  <path d="M 96 128 A 12 12 0 0 1 120 128" fill="none" stroke="#E6EDF3" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Small technical corner marks -->
  <path d="M 12 12 L 36 12" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.5"/>
  <path d="M 12 12 L 12 36" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.5"/>
  <path d="M 244 244 L 220 244" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.5"/>
  <path d="M 244 244 L 244 220" fill="none" stroke="#38F2C8" stroke-width="2" opacity="0.5"/>
  
  <!-- Signal nodes on outer rings -->
  <circle cx="108" cy="32" r="3" fill="#38F2C8" opacity="0.7"/>
  <circle cx="204" cy="128" r="2.5" fill="#38F2C8" opacity="0.5"/>
  <circle cx="108" cy="224" r="2" fill="#38F2C8" opacity="0.3"/>
  
  <!-- Tiny viewer count dots - dashboard detail -->
  <circle cx="36" cy="228" r="2" fill="#E6EDF3" opacity="0.4"/>
  <circle cx="46" cy="228" r="2" fill="#E6EDF3" opacity="0.3"/>
  <circle cx="56" cy="228" r="2" fill="#E6EDF3" opacity="0.2"/>
  <circle cx="66" cy="228" r="2" fill="#E6EDF3" opacity="0.1"/>
  
  <!-- Wordmark - small, bottom right -->
  <text x="210" y="230" font-family="monospace" font-size="9" fill="#E6EDF3" opacity="0.5" text-anchor="end" letter-spacing="1">YT-VIEWER</text>
</svg>
